<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SK Traders & Manufacturers</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER (same as other pages, already hai) -->

<section class="contact-hero">
  <div class="container">
    <h1>Contact SK Traders & Manufacturers</h1>
    <p>Get reliable supply of Acrabond adhesives, industrial tapes, and packaging materials across Delhi NCR.</p>
  </div>
</section>

<section class="contact-section">
  <div class="container contact-grid">

    <div class="contact-info">
      <h3>Reach Us</h3>
      <p><strong>Address:</strong> Noida, Delhi NCR</p>
      <p><strong>Phone:</strong> +91 XXXXX XXXXX</p>
      <p><strong>Email:</strong> sales@sktraders.com</p>
      <p>Bulk supply • Industrial support • Reliable timelines</p>
    </div>

    <div class="contact-form">
      <h3>Send Enquiry</h3>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="text" placeholder="Phone Number">
        <textarea placeholder="Your Requirement"></textarea>
        <button type="submit">Submit Enquiry</button>
      </form>
    </div>

  </div>
</section>

<section class="contact-map">
  <iframe 
    src="https://www.google.com/maps?q=Noida&output=embed"
    loading="lazy">
  </iframe>
</section>

<!-- FOOTER (same as other pages) -->

</body>
</html>
