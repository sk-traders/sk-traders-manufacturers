<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | SK Traders & Manufacturers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f7f7f7;
    }

    .contact-section{
      max-width:1100px;
      margin:60px auto;
      background:#fff;
      padding:40px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    h2{
      margin-bottom:15px;
      color:#111;
    }

    .reach-us p{
      margin:8px 0;
      color:#444;
      font-size:15px;
    }

    .reach-us strong{
      color:#000;
    }

    .contact-form input,
    .contact-form textarea{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:14px;
    }

    .contact-form textarea{
      resize:none;
      height:120px;
    }

    .contact-form button{
      background:#c62828;
      color:#fff;
      border:none;
      padding:12px 20px;
      font-size:15px;
      border-radius:6px;
      cursor:pointer;
    }

    .contact-form button:hover{
      background:#a61f1f;
    }

    .map{
      grid-column:1 / -1;
      margin-top:20px;
    }

    .map iframe{
      width:100%;
      height:350px;
      border:0;
      border-radius:8px;
    }

    @media(max-width:768px){
      .contact-section{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <section class="contact-section">

    <div class="reach-us">
      <h2>Reach Us</h2>
      <p><strong>Address:</strong> G-17 Sector-6, Noida Gautam Budh Nagar Uttar Pradesh-201301</p>
      <p><strong>Phone:</strong> +91 9871095529</p>
      <p><strong>Email:</strong> sktraders.noida011@gmail.com</p>
      <p>Bulk supply • Industrial support • Reliable timelines</p>
    </div>

    <div class="contact-form">
      <h2>Send Enquiry</h2>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Email Address">
      <input type="text" placeholder="Phone Number">
      <textarea placeholder="Your Requirement"></textarea>
      <button>Submit Enquiry</button>
    </div>

    <div class="map">
      <iframe 
        src="https://share.google/4RoIvkB55MA0yBEkJ"
        loading="lazy">
      </iframe>
    </div>

  </section>

</body>
</html>
